<!DOCTYPE html>
<html lang="pt=br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escritório de Engenharia Cívil</title>
</head>

<!--  REALIZAR UM SITE DE CALCULOS DE FÓRMULAS -->
  
<body>

  <script>
    window.alert ("Olá! Seja bem-vindo ao nosso site.")
    window.alert ("Você fará o calculo de um Circulo.")
    var Pi = 3.14
    var Raio = Number.parseFloat(window.prompt ("Raio:  "))
    var Resultado = Number.parseFloat(Pi * (Raio ** 2))
    Raio.toFixed(2).replace('.',',')
    Resultado.toFixed(2).replace('.',',')
    window.alert ("Este é o resultado: " + Resultado)
    
    // NÃO ESTÁ RECONHECENDO A VÍRGULA

  </script>
</body>

</html>
